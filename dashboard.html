<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#123d32">
    <title>Dashboard | Awka Direct</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body data-page="dashboard">
    <header class="dash-topbar"><a class="brand" href="index.html"><span class="brand-mark">A</span><span>awka<span
                    class="brand-light">direct</span><small>WORKSPACE</small></span></a>
        <div class="dash-top-actions"><span class="demo-tag">FRONTEND DEMO</span><a href="index.html"
                class="btn btn-light">Marketplace</a><span id="top-avatar" class="avatar">AD</span></div>
    </header>
    <div class="dashboard-layout">
        <aside class="sidebar"><label class="role-switch-label">Preview workspace<select id="role-switch">
                    <option value="tenant">Tenant</option>
                    <option value="landlord">Landlord</option>
                    <option value="caretaker">Caretaker</option>
                    <option value="admin">Admin</option>
                </select></label>
            <nav id="side-nav" class="side-nav"></nav><a class="sidebar-market" href="index.html">← Back to
                marketplace</a>
        </aside>
        <main class="dash-main">
            <div class="dash-heading">
                <div><span id="dash-eyebrow" class="eyebrow">WORKSPACE</span>
                    <h1 id="dash-title">Dashboard</h1>
                    <p id="dash-subtitle">Manage your activity.</p>
                </div><button id="primary-action" class="btn btn-primary">Continue</button>
            </div>
            <div id="screen-content"></div>
            <footer class="dash-footer">Awka Direct · Demo data is stored in this browser only.</footer>
        </main>
    </div>
    <dialog id="dash-dialog" class="dialog"><button class="dialog-close" data-close-dialog aria-label="Close">×</button>
        <div id="dash-dialog-content"></div>
    </dialog>
    <div id="toast" class="toast" role="status"></div>
    <script src="app.js"></script>
</body>

</html>
